[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playable-factory-showcase"
version = "0.1.0"
description = "A traceable multi-agent pipeline for generating and auditing playable-ad H5 demos."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "langgraph>=0.2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["openai>=1.0.0"]

[tool.ruff]
line-length = 100
target-version = "py310"
